name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from Info.plist
        id: get_version
        run: |
          VERSION=$(grep -A1 '<key>PluginVersion</key>' miniUniFi.indigoPlugin/Contents/Info.plist | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Verify tag matches plugin version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match PluginVersion ${VERSION}."
            exit 1
          fi

      - name: Create plugin bundle zip
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          zip -r "miniUniFi.indigoPlugin.zip" "miniUniFi.indigoPlugin"
          echo "Created miniUniFi.indigoPlugin.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: berkinet fork v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: miniUniFi.indigoPlugin.zip
